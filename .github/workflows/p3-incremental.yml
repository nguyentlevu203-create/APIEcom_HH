# P3 — V0 scheduled incremental ingestion (Shopee + TikTok).
#
# PHASE 6C UPDATE (2026-09-21, LOCAL ONLY — NOT ENABLED, NOT PUSHED):
# this repo now HAS a GitHub remote (github.com/nguyentlevu203-create/
# APIEcom_HH.git) — the original blocker #1 below no longer applies.
# Blockers #2 (credential abstraction) and #3 (token provisioning) are
# addressed by this revision's env-var precedence in incr_common.py /
# shopee/keychain.py / tiktok_shop/keychain.py (env var wins when
# present, macOS Keychain fallback unchanged for local/Mac use) and by
# the token-provisioning steps added below. `schedule:` stays commented
# out — a human must review this file in its actual repo context, add
# the GitHub Secrets listed below, and uncomment it before it ever runs
# unattended. This file itself makes no such decision.
#
# Runs the REAL production entrypoint (scripts/run_production_cycle.py —
# incremental CORE, then GOLD, then reconciliation, then a production
# health check, in that order, per that script's own docstring) rather
# than pipelines/incremental.py alone, matching what the (currently
# broken) macOS LaunchAgent was supposed to run.
#
# Required GitHub Secrets (create these in the repo's Settings before
# ever uncommenting `schedule:` — names only, no values here):
#   HH_ETL_WRITER_DATABASE_URL      (Neon hh_etl_writer role connection string)
#   HH_NEONDB_OWNER_DATABASE_URL    (Neon neondb_owner role — read-only usage
#                                     in this workflow: healthcheck + source-
#                                     coverage snapshot only, never DDL)
#   SHOPEE_LIVE_PARTNER_KEY
#   SHOPEE_SHOP_ID
#   SHOPEE_PARTNER_ID
#   SHOPEE_ACCESS_TOKEN               (legacy bootstrap fallback — see P10-BIS)
#   SHOPEE_REFRESH_TOKEN               (legacy bootstrap fallback — see P10-BIS)
#   SHOPEE_ACCESS_TOKEN_EXPIRE_AT      (legacy bootstrap fallback — see P10-BIS)
#   SHOPEE_REFRESH_TOKEN_EXPIRE_AT     (legacy bootstrap fallback — see P10-BIS)
#   SHOPEE_TOKEN_STATE_JSON     (bundled rotating state; takes precedence
#                                 once present — see integrations/shopee/
#                                 keychain.py and github_secrets_writer.py)
#   SHOPEE_AMS_LIVE_PARTNER_KEY (AMS app, id 2044772 — separate from the
#                                 main app above, see auth/token_exchange_ams.py)
#   SHOPEE_AMS_SHOP_ID
#   SHOPEE_AMS_TOKEN_STATE_JSON (AMS bundled rotating state — P11-BIS,
#                                 independent of SHOPEE_TOKEN_STATE_JSON)
#   GH_SECRETS_WRITER_TOKEN     (fine-grained PAT, this repo only, Secrets:
#                                 read/write — used to persist a rotated
#                                 Shopee token state back into this list;
#                                 default GITHUB_TOKEN cannot do this)
#   TIKTOK_APP_SECRET
#   TIKTOK_TOKENS_JSON        (full JSON content of tokens.json)
#   TIKTOK_SHOP_INFO_JSON     (full JSON content of shop_info.json)
#
# Cron timezone note (verified, not assumed): GitHub Actions `schedule`
# events run in UTC ONLY. Business cadence (from the disabled macOS
# LaunchAgent plist, com.hh.ecom.production.cycle.plist) is 06:00 and
# 18:00 Asia/Ho_Chi_Minh (UTC+7, no daylight saving, constant offset):
#   06:00 ICT - 7h = 23:00 UTC (previous day)  -> cron "0 23 * * *"
#   18:00 ICT - 7h = 11:00 UTC (same day)      -> cron "0 11 * * *"

name: P3 Incremental Ingestion (Shopee + TikTok)

on:
  # DISABLED on purpose — see header. Uncomment only after every secret
  # above exists in this repo's Settings and a human has reviewed this
  # file in its actual repo context (Task E: only after a controlled
  # manual catch-up has PASSed).
  # schedule:
  #   - cron: "0 23 * * *"   # 06:00 Asia/Ho_Chi_Minh
  #   - cron: "0 11 * * *"   # 18:00 Asia/Ho_Chi_Minh
  workflow_dispatch: {}   # manual trigger only, for now

concurrency:
  # Same intent as run_production_cycle.py's own fcntl single-instance
  # lock (still in effect within one runner) — this additionally stops
  # a second GitHub-triggered run from starting while one is still in
  # flight (e.g. a manual dispatch overlapping a scheduled fire), so two
  # cycles never race each other against the same production database.
  group: p3-incremental-production-cycle
  cancel-in-progress: false

jobs:
  incremental:
    runs-on: ubuntu-latest
    # P11-BIS (2026-09-21): 25 min was too short for a cold, multi-day
    # catch-up run (schedule had been disabled) — the first real
    # workflow_dispatch run was killed by this timeout mid-cycle after
    # Shopee finance alone took ~17 min. 60 min gives real headroom for
    # a catch-up while still bounding a genuinely hung job. Not removed
    # entirely, not parallelized — revisit downward once steady-state
    # (small incremental window) run durations are observed.
    #
    # P11-TER (2026-09-22): scripts/run_production_cycle.py now bounds
    # each stage explicitly (ingestion 3600s + reconciliation 1800s +
    # healthcheck 120s = up to ~92 min worst case) instead of one hidden
    # 1800s covering the whole cycle — 60 min could no longer fit a real
    # catch-up ingestion window on its own. Raised to 90 for this
    # checkpoint's controlled run.
    #
    # P11-QUATER (2026-09-22): 90 min was proven too tight live — the
    # controlled run's ingestion (3600s) and reconciliation (1800s)
    # stages alone summed to exactly 90 min, leaving zero margin for
    # GOLD/setup/coverage/healthcheck/log-upload; GitHub cancelled the
    # job externally a few seconds before it would have finished
    # cleanly. scripts/test_run_production_cycle_timeouts.py (Q6) checks
    # this relationship against the true mathematical worst case — every
    # stage independently using its full budget, including all 7 Gold
    # scripts each hitting their own 600s cap — which sums to 9720s
    # (162 min), not just ingestion+reconciliation's ~92 min. 120 did not
    # clear that bar. Raised to 170 (9720s + 300s minimum margin the test
    # requires, rounded up) — still bounded, still not unlimited; in
    # practice Gold scripts currently fail in under a second (see the
    # P11-QUATER report), so this ceiling is not expected to be reached,
    # it exists to catch a genuinely hung job.
    #
    # P11-QUINQUE (2026-09-22) Q6/Q7: RECONCILIATION_TIMEOUT_SECONDS
    # raised 1800 -> 3600 (proven live, P11-QUATER-LIVE: reconciliation
    # used its full 1800s and was still mid-domain, a cumulative-budget
    # shortfall, not a containment failure). New worst-case envelope:
    # ingestion 3600s + 7 Gold scripts x 600s (4200s) + reconciliation
    # 3600s + healthcheck 120s = 11520s, +300s minimum margin = 11820s.
    # 200 min = 12000s clears that with room to spare.
    #
    # P11-LAST-MILE (2026-09-24): RECONCILIATION_TIMEOUT_SECONDS raised
    # 3600 -> 6000 (live timing, run 35832785885: D1+D3 alone used ~3372s,
    # D7 was cut off after 5 of 11 domains). New worst-case envelope:
    # ingestion 3600s + 7 Gold x 600s (4200s) + reconciliation 6000s +
    # healthcheck 120s = 13920s, +300s minimum margin = 14220s (237 min).
    # 240 min = 14400s clears that.
    timeout-minutes: 240
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # RESOLVED (P10-BIS.10, 2026-09-21): local production Mac runs
          # Python 3.14, this workflow pins 3.11. Verified under a real
          # isolated 3.11 venv (not just py_compile) rather than assumed:
          # all Shopee credential-backend tests (16/16), all TikTok
          # pilot_reporting tests (59/59), and all pipelines/ tests
          # (80/80) pass; `python -m compileall` is clean across scripts/,
          # pipelines/, integrations/shopee, integrations/tiktok_shop.
          # 3.11 confirmed safe for this workflow.
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r integrations/tiktok_shop/requirements.txt
          pip install psycopg2-binary keyring requests pynacl

      - name: Provision TikTok tokens (from secrets, never committed)
        # token_store.py reads these via a plain relative path
        # (integrations/tiktok_shop/{tokens,shop_info}.json) — no code
        # change needed there, just write the secret content to that
        # same path at runtime. Restrictive permissions match what
        # authorize.py itself sets locally (0600).
        run: |
          umask 077
          printf '%s' "$TIKTOK_TOKENS_JSON" > integrations/tiktok_shop/tokens.json
          printf '%s' "$TIKTOK_SHOP_INFO_JSON" > integrations/tiktok_shop/shop_info.json
          chmod 600 integrations/tiktok_shop/tokens.json integrations/tiktok_shop/shop_info.json
        env:
          TIKTOK_TOKENS_JSON: ${{ secrets.TIKTOK_TOKENS_JSON }}
          TIKTOK_SHOP_INFO_JSON: ${{ secrets.TIKTOK_SHOP_INFO_JSON }}

      - name: Run production cycle (CORE -> GOLD -> reconcile -> healthcheck)
        run: python3 scripts/run_production_cycle.py
        env:
          HH_ETL_WRITER_DATABASE_URL: ${{ secrets.HH_ETL_WRITER_DATABASE_URL }}
          HH_NEONDB_OWNER_DATABASE_URL: ${{ secrets.HH_NEONDB_OWNER_DATABASE_URL }}
          SHOPEE_LIVE_PARTNER_KEY: ${{ secrets.SHOPEE_LIVE_PARTNER_KEY }}
          SHOPEE_SHOP_ID: ${{ secrets.SHOPEE_SHOP_ID }}
          SHOPEE_PARTNER_ID: ${{ secrets.SHOPEE_PARTNER_ID }}
          # Legacy individual rotating-field secrets — kept only as a
          # backward-compatible bootstrap fallback (P10-BIS.2/.8). Once
          # SHOPEE_TOKEN_STATE_JSON exists it takes precedence; these are
          # read only if that bundle is absent or a field inside it is
          # empty/null. See integrations/shopee/keychain.py.
          SHOPEE_ACCESS_TOKEN: ${{ secrets.SHOPEE_ACCESS_TOKEN }}
          SHOPEE_REFRESH_TOKEN: ${{ secrets.SHOPEE_REFRESH_TOKEN }}
          SHOPEE_ACCESS_TOKEN_EXPIRE_AT: ${{ secrets.SHOPEE_ACCESS_TOKEN_EXPIRE_AT }}
          SHOPEE_REFRESH_TOKEN_EXPIRE_AT: ${{ secrets.SHOPEE_REFRESH_TOKEN_EXPIRE_AT }}
          # Bundled rotating-state snapshot (P10-BIS) — one atomic secret
          # containing access_token/refresh_token/*_expire_at together, so
          # a refresh mid-run never leaves a partially-updated legacy set.
          SHOPEE_TOKEN_STATE_JSON: ${{ secrets.SHOPEE_TOKEN_STATE_JSON }}
          # AMS (affiliate) app — a SEPARATE Shopee app (id 2044772) from
          # the main one above, with its own static credentials and its
          # own rotating-state bundle (P11-BIS). Never mixed with the
          # SHOPEE_* names above. See integrations/shopee/auth/
          # token_exchange_ams.py.
          SHOPEE_AMS_LIVE_PARTNER_KEY: ${{ secrets.SHOPEE_AMS_LIVE_PARTNER_KEY }}
          SHOPEE_AMS_SHOP_ID: ${{ secrets.SHOPEE_AMS_SHOP_ID }}
          SHOPEE_AMS_TOKEN_STATE_JSON: ${{ secrets.SHOPEE_AMS_TOKEN_STATE_JSON }}
          # Dedicated fine-grained PAT (repo-scoped, Secrets: read/write
          # only) used solely to durably persist a rotated Shopee token
          # state back to this repo's Actions Secrets from inside the run
          # — intentionally NOT the default GITHUB_TOKEN, which cannot
          # write repository secrets, and NOT a broad personal PAT.
          GH_SECRETS_WRITER_TOKEN: ${{ secrets.GH_SECRETS_WRITER_TOKEN }}
          TIKTOK_APP_SECRET: ${{ secrets.TIKTOK_APP_SECRET }}

      - name: Clean up provisioned token files
        # Belt-and-suspenders: GitHub-hosted runners are ephemeral VMs
        # destroyed after the job regardless, but this keeps the same
        # discipline as authorize.py's "never leave secrets lying around
        # longer than needed" convention, and matters if this workflow
        # is ever pointed at a self-hosted/reused runner later.
        if: always()
        run: rm -f integrations/tiktok_shop/tokens.json integrations/tiktok_shop/shop_info.json

      - name: Upload cycle logs (observability, D4)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-cycle-logs-${{ github.run_id }}
          path: artifacts/v0/cycle_logs/
          retention-days: 14

      # D4: workflow failure is visible natively via GitHub's own Actions
      # UI/notifications (job goes red, org/user gets a notification per
      # their GitHub notification settings) — no Slack/email integration
      # exists in this repo today, so none is invented here. Non-zero
      # exit is already guaranteed by scripts/run_production_cycle.py's
      # own `sys.exit(main())` (0 on GREEN/YELLOW verdict, 1 on RED).
